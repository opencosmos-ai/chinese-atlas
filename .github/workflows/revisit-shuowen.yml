name: revisit-shuowen

# A reminder with a date on it. The 說文解字 block was hidden from the
# character card on 2026-10-14 until it is accessible to English-only readers
# (README.md → Deferred). On 2026-12-14 this opens an issue so the decision
# is revisited rather than forgotten. Delete this file once the issue exists.

on:
  schedule:
    - cron: "0 16 14 12 *"     # 14 December, 16:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: open the revisit issue, once
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title="Revisit: bring 說文解字 back to the character card, accessibly"
          if gh issue list -R "$REPO" --state all --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            echo "already opened"; exit 0
          fi
          gh issue create -R "$REPO" --title "$title" --body "On 2026-10-14 the 說文解字 block (Xu Shen's definition, c. 100 CE) was hidden from the character card, because 795 of 798 lines were untranslated Chinese that an English-only reader could not use.

          **Decide whether and how it returns.** Options recorded at the time:
          - render the structural half in English from the existing parse (\"from 彳, with 巠 for sound\");
          - translate the definitions, by hand or as glossary entries research them;
          - show the block only where a translation exists.

          The block is commented out in \`atlas/assets/atlas.js\`; the data still ships. See README.md → Deferred. Delete \`.github/workflows/revisit-shuowen.yml\` once this is decided."
