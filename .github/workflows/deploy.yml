name: deploy

# The atlas has no content of its own. It rebuilds whenever a translation it
# reads changes, so a merged glossary edit reaches the public site in minutes:
#
#   repository_dispatch  sent by a translation repo when its export changes
#   schedule             a fallback, in case a dispatch is ever missed
#   push                 changes to the atlas itself

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [text-updated]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No install step: the build is stdlib only. (atlas/fonts.py needs
      # fonttools, but only a maintainer runs it; CI reads its output.)
      - name: tests — every page, every link, no stray Markdown
        env:
          ATLAS_REMOTE: "1"
        run: python3 -m unittest discover -s tests -t . -v

      - name: build from every translation's main branch
        run: python3 -m atlas.build --remote

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
